<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilos</title>
    <style></style>
</head>
<body>

<!-- Text -->
    <form action="" method="post">
        <div>
            <label for="texto">Texto</label>
            <input type="text" name="texto" id="texto" placeholder="Texto">
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="email@gmail.com">
        </div>
        <div>
            <label for="password">Senha</label>
            <input type="password" name="pass" id="pass" placeholder="Digite e salve sua senha">
        </div>
        <div>
            <label for="B">B</label>
            <input type="button" value="5">
        </div>
        <div>
            <label for="button">BNT</label>
            <input type="button" value="BNT">
        </div>
        <div>
            <label for="C">C</label>
            <input type="checkbox" name="C" id="C">
        </div>
        <div>
            <label for="color">Cores</label>
            <input type="color" name="color" id="color">
        </div>
        <div>
            <label for="data">Data</label>
            <input type="date" name="data" id="data">
        </div>
        <div>
            <label for="date.time.local">Calendário completo</label>
            <!-- <input type="datetime" name="" id=""> -->
            <input type="datetime-local" name="date.time.local" id="date.time.local">
        </div>
        <div>
            <label for="arquivo">Arquivo</label>
            <input type="file" name="arquivo" id="arquivo">
        </div>
        <div>
            <label for="escondido">Escondido</label>
            <input type="hidden" name="escondido">
        </div>
        <div>
            <label for="">Raul</label>
            <input type="image" src="/styles/media/raul.png" alt="">
        </div>
        <div>
            <label for="mes" >Mês</label>
            <input type="month" name="mes" id="mes">
        </div>
        <div>
            <label for="tel">Telefone</label>
            <input type="tel" name="tel" id="tel">
        </div>
        <div>
            <label for="radio">Radio</label>
            <input type="radio" name="radio" id="radio">
        </div>
        <div>
            <label for="range">Volume</label>
            <input type="range" name="range" id="range">
        </div>
        <div>
            <label for="reset">Resetar</label>
            <input type="reset" value="reset">
        </div>
        <div>
            <label for="hour">Hora</label>
            <input type="time" name="hour" id="hour">
        </div>
        <div>
            <label for="url">Link</label>
            <input type="url" name="url" id="url">
        </div>
        <div>
            <label for="week">Semana</label>
            <input type="week" name="week" id="week">
        </div>
        <div>
            <select name="selecionar" id="seletores">
                <option value="1">Numero 1</option>
                <option value="2">Numero 2</option>
            </select>
        </div>
    </form>

</body>
</html>
