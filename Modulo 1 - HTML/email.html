<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <a href="/styles/forms.html">Form</a>

    <form action="">
        <div>
            <label for="nome">Texto</label>
            <input required type="text" minlength="3" name="nome" id="nome">
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" name="email" id="email">
        </div>
        <div>
            <fieldset>
                <legend>Assunto</legend>
                <div>
                    <label for="compra">
                        <input type="radio" name="assunto" id="compra" required> Compra
                    </label>
                    <label>
                        <input type="radio" name="assunto" id="cotar" required> Cotação
                    </label>
                </div><br>
                <div>
                    <label for="">Mensagem</label><br>
                    <textarea required name="mensagem" id="mensagem" placeholder="Escreva os detalhes"></textarea>
                </div>
                <div><br>
                    <input type="button" value="Enviar">
                    <input type="reset" value="Limpar">
                </div>
            </fieldset>
        </div>
    </form>

</body>
</html>
